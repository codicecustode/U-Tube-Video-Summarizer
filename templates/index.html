<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Summarizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #9a9ab0;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px 24px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9a9ab0;
      margin-bottom: 6px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: #e0e0e0;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }

    input:focus, select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    select option { background: #1e1e2f; color: #e0e0e0; }

    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; min-width: 0; }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 4px;
    }

    button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .hint {
      font-size: 0.8rem;
      color: #9a9ab0;
      margin: -8px 0 12px;
    }

    /* Thumbnail preview */
    .thumbnail {
      display: none;
      margin: 0 0 16px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .thumbnail img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    /* Output */
    .output-section {
      margin-top: 24px;
      display: none;
    }

    .output-section.visible { display: block; }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .output-header h2 { font-size: 1rem; color: #b0b0c8; }

    .copy-btn {
      width: auto;
      padding: 6px 14px;
      font-size: 0.8rem;
      margin: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .copy-btn:hover { background: rgba(255, 255, 255, 0.14); }

    .output-body {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 20px;
      line-height: 1.7;
      white-space: pre-wrap;
      font-size: 0.95rem;
      max-height: 500px;
      overflow-y: auto;
    }

    .output-body.error { color: #f87171; border-color: rgba(248, 113, 113, 0.2); }

    .meta {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #6a6a80;
      text-align: right;
    }

    .loader {
      display: none;
      text-align: center;
      margin-top: 24px;
      color: #667eea;
      font-size: 0.95rem;
    }
    .loader.active { display: block; }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 22px; height: 22px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 500px) {
      .row { flex-direction: column; gap: 0; }
      h1 { font-size: 1.4rem; }
      .card { padding: 20px 16px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>YouTube Video Summarizer</h1>
    <p class="subtitle">Pick a model, paste a link, get the key points</p>

    <div class="card">
      <label for="youtubeUrl">YouTube link</label>
      <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." autofocus />

      <div class="thumbnail" id="thumbnail">
        <img id="thumbImg" alt="Video thumbnail" />
      </div>

      <div class="row">
        <div>
          <label for="providerSelector">Provider</label>
          <select id="providerSelector" onchange="fillModels()">
            <option>Loading...</option>
          </select>
        </div>
        <div>
          <label for="modelSelector">Model</label>
          <select id="modelSelector"></select>
        </div>
      </div>
      <p id="modelHint" class="hint"></p>

      <button id="summarizeBtn" onclick="sendUrl()">Summarize</button>
    </div>

    <div class="loader" id="loader">
      <div class="spinner"></div>Summarizing with <span id="loaderModel"></span>...
    </div>

    <div class="output-section" id="outputSection">
      <div class="output-header">
        <h2>Summary</h2>
        <button class="copy-btn" onclick="copySummary()">Copy</button>
      </div>
      <div class="output-body" id="output"></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <script>
    let providers = [];

    async function loadModels() {
      const providerSelect = document.getElementById('providerSelector');
      const hint = document.getElementById('modelHint');
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        providers = data.providers;

        providerSelect.innerHTML = '';
        for (const p of providers) {
          const label = p.available ? p.label : `${p.label} (no key)`;
          const opt = new Option(label, p.id);
          opt.disabled = !p.available;
          providerSelect.add(opt);
        }

        if (data.default) {
          providerSelect.value = data.default.provider;
          fillModels(data.default.model);
          hint.textContent = '';
        } else {
          fillModels();
          hint.textContent = 'Add at least one API key to .env and restart.';
        }
      } catch (e) {
        hint.textContent = 'Could not load models.';
      }
    }

    function fillModels(selected) {
      const id = document.getElementById('providerSelector').value;
      const sel = document.getElementById('modelSelector');
      const p = providers.find(x => x.id === id);
      sel.innerHTML = '';
      for (const m of (p ? p.models : [])) sel.add(new Option(m.label, m.id));
      if (selected) sel.value = selected;
    }

    function extractVideoId(url) {
      const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/|live\/))([\w-]{11})/);
      return m ? m[1] : null;
    }

    // Show thumbnail as user types
    document.getElementById('youtubeUrl').addEventListener('input', function () {
      const vid = extractVideoId(this.value);
      const thumb = document.getElementById('thumbnail');
      if (vid) {
        document.getElementById('thumbImg').src = `https://img.youtube.com/vi/${vid}/mqdefault.jpg`;
        thumb.style.display = 'block';
      } else {
        thumb.style.display = 'none';
      }
    });

    async function sendUrl() {
      const url = document.getElementById('youtubeUrl').value;
      const provider = document.getElementById('providerSelector').value;
      const model = document.getElementById('modelSelector').value;
      const videoId = extractVideoId(url);

      const btn = document.getElementById('summarizeBtn');
      const loader = document.getElementById('loader');
      const section = document.getElementById('outputSection');
      const output = document.getElementById('output');
      const meta = document.getElementById('meta');

      if (!videoId) {
        section.classList.add('visible');
        output.textContent = 'Paste a valid YouTube link above.';
        output.className = 'output-body error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Summarizing...';
      loader.classList.add('active');
      document.getElementById('loaderModel').textContent =
        document.getElementById('modelSelector').selectedOptions[0]?.text || model;
      section.classList.remove('visible');

      const start = Date.now();
      try {
        const res = await fetch('/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ video_id: videoId, provider, model }),
        });
        const data = await res.json();
        const seconds = ((Date.now() - start) / 1000).toFixed(1);

        section.classList.add('visible');
        if (!res.ok || data.error) {
          output.textContent = data.error || 'Something went wrong.';
          output.className = 'output-body error';
          meta.textContent = '';
        } else {
          const note = data.truncated ? 'Note: this video is long, so the summary covers only the first part.\n\n' : '';
          output.textContent = note + (data.summary || 'No summary received.');
          output.className = 'output-body';
          const providerLabel = providers.find(p => p.id === data.provider)?.label || data.provider;
          meta.textContent = `${providerLabel} · ${data.model} · ${seconds}s`;
        }
      } catch (e) {
        section.classList.add('visible');
        output.textContent = 'Network error. Check your connection and try again.';
        output.className = 'output-body error';
        meta.textContent = '';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Summarize';
        loader.classList.remove('active');
      }
    }

    function copySummary() {
      const text = document.getElementById('output').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    }

    // Enter key triggers summarize
    document.getElementById('youtubeUrl').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') sendUrl();
    });

    loadModels();
  </script>
</body>

</html>
