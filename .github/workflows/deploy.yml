name: Deploy to GCP VM
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} << 'EOF'
            set -e
            cd ~/my-fastapi-app

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Write a .env file from secrets so the app reads them on start
            cat > .env << ENVEOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
          ENVEOF

            # Install dependencies
            source venv/bin/activate
            pip install -q -r requirements.txt

            # Restart the app (kill old process first)
            pkill -f "uvicorn main:app" || true
            sleep 1
            nohup uvicorn main:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
            sleep 2
            curl -sf http://localhost:8000/api/models > /dev/null && echo "Deploy OK" || echo "Health check failed"
          EOF
